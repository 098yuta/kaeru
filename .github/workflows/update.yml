name: KAERU weekly update

on:
  schedule:
    - cron: "7 3 * * 1"   # 毎週月曜 12:07 (JST)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kaeru-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update prices from SNKRDUNK
        run: python scripts/update.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "kaeru-bot"
          git config user.email "kaeru-bot@users.noreply.github.com"
          git add data.json add.txt
          git commit -m "weekly price update $(TZ=Asia/Tokyo date +%F)"
          git push
